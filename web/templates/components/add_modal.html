{{define "add_modal.html"}}
<div id="add-modal" class="modal-backdrop hidden" onclick="if(event.target===this) this.classList.add('hidden')">
  <div class="modal-content">
    <div class="modal-header">
      <h3 class="modal-title">✨ Add New Item</h3>
      <button type="button" class="action-btn" onclick="document.getElementById('add-modal').classList.add('hidden')">✕</button>
    </div>
    <form id="add-item-form"
          hx-post="/items"
          hx-target="#timeline-container"
          hx-swap="innerHTML"
          hx-on::after-request="if(event.detail.successful) { document.getElementById('add-modal').classList.add('hidden'); this.reset(); }">
      <div class="modal-body">
        <div id="form-error-msg" style="color: #f87171; font-size: 0.85rem; margin-bottom: 0.75rem;"></div>

        <div class="form-group">
          <label class="form-label">Type</label>
          <div class="type-selector">
            <label class="type-option active" onclick="selectType(this, 'college_task')">
              <input type="radio" name="type" value="college_task" checked style="display:none;">
              🎓 College Task
            </label>
            <label class="type-option" onclick="selectType(this, 'work_due')">
              <input type="radio" name="type" value="work_due" style="display:none;">
              💼 Work Due
            </label>
            <label class="type-option" onclick="selectType(this, 'event')">
              <input type="radio" name="type" value="event" style="display:none;">
              📅 Event
            </label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="add-title">Title *</label>
          <input type="text" id="add-title" name="title" class="form-control" placeholder="e.g. CS101 Homework or Team Sync" required autofocus>
        </div>

        <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
          <div>
            <label class="form-label" id="label-start-at">Due / Start Date *</label>
            <input type="datetime-local" id="add-start-at" name="start_at" class="form-control" required>
          </div>
          <div id="end-at-container" style="display: none;">
            <label class="form-label">End Date (optional)</label>
            <input type="datetime-local" id="add-end-at" name="end_at" class="form-control">
          </div>
          <div id="priority-container">
            <label class="form-label">Priority</label>
            <select name="priority" class="form-control">
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
              <option value="low">Low</option>
            </select>
          </div>
        </div>

        <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
          <div>
            <label class="form-label" id="label-tag">Course / Project Tag</label>
            <input type="text" name="context_tag" class="form-control" placeholder="e.g. CS301 or Sprint-1">
          </div>
          <div>
            <label class="form-label" id="label-url">Location or URL</label>
            <input type="text" name="location_or_url" class="form-control" placeholder="e.g. Room 402 or https://...">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Description (optional)</label>
          <textarea name="description" class="form-control" rows="2" placeholder="Additional details or notes..."></textarea>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-secondary" onclick="document.getElementById('add-modal').classList.add('hidden')">Cancel</button>
        <button type="submit" class="btn-primary">Save Item</button>
      </div>
    </form>
  </div>
</div>

<script>
function selectType(el, type) {
  document.querySelectorAll('.type-option').forEach(opt => opt.classList.remove('active'));
  el.classList.add('active');
  const radio = el.querySelector('input[type="radio"]');
  if (radio) radio.checked = true;

  const endContainer = document.getElementById('end-at-container');
  const priorityContainer = document.getElementById('priority-container');
  const labelStart = document.getElementById('label-start-at');
  const labelTag = document.getElementById('label-tag');

  if (type === 'event') {
    if (endContainer) endContainer.style.display = 'block';
    if (priorityContainer) priorityContainer.style.display = 'none';
    if (labelStart) labelStart.textContent = 'Event Start *';
    if (labelTag) labelTag.textContent = 'Event Tag';
  } else {
    if (endContainer) endContainer.style.display = 'none';
    if (priorityContainer) priorityContainer.style.display = 'block';
    if (labelStart) labelStart.textContent = 'Due Date *';
    if (labelTag) labelTag.textContent = type === 'college_task' ? 'Course Tag' : 'Project Tag';
  }
}

// Default date to now rounded to next hour
document.addEventListener('DOMContentLoaded', function() {
  const startInput = document.getElementById('add-start-at');
  if (startInput && !startInput.value) {
    const d = new Date();
    d.setMinutes(0, 0, 0);
    d.setHours(d.getHours() + 1);
    const pad = n => String(n).padStart(2, '0');
    startInput.value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
});
</script>
{{end}}
