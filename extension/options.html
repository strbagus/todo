<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo New Tab Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
      min-width: 380px;
    }
    h2 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    p {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 0.35rem;
      color: #cbd5e1;
    }
    input[type="text"] {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 0.5rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .presets {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .preset-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 0.25rem;
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .preset-btn:hover {
      background: #334155;
      color: #fff;
    }
    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 1.25rem 0;
    }
    .btn-save {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 0.55rem;
      border-radius: 0.375rem;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-save:hover {
      background: #0369a1;
    }
    .status {
      font-size: 0.8rem;
      text-align: center;
      margin-top: 0.5rem;
      min-height: 1.2rem;
      color: #34d399;
    }
  </style>
</head>
<body>
  <h2>New Tab Settings</h2>
  <p>Configure dashboard URL and wallpaper</p>

  <label for="targetUrl">Server Address</label>
  <input type="text" id="targetUrl" placeholder="http://localhost:8080" />

  <div class="presets">
    <button class="preset-btn" data-url="http://localhost:8080">Local (8080)</button>
    <button class="preset-btn" data-url="https://todo.strbagus.com">Production</button>
  </div>

  <div class="divider"></div>

  <label for="bgUrl">Wallpaper Image URL</label>
  <input type="text" id="bgUrl" placeholder="/static/img/mywall.jpg or https://image-url..." />

  <div class="presets">
    <button class="preset-bg-btn" data-bg="/static/img/mywall.jpg">mywall.jpg (Default)</button>
    <button class="preset-bg-btn" data-bg="none">None (Dark Gradient)</button>
  </div>

  <button class="btn-save" id="save-btn">Save Settings</button>
  <div class="status" id="status"></div>

  <script src="options.js"></script>
</body>
</html>
